<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Lovely Path of 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
            --bg-white: rgba(255, 255, 255, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--soft-pink) 0%, #ffe4e1 100%);
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* 가로로 와이드한 중앙 박스 */
        #game-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            height: 500px;
            background: var(--bg-white);
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 183, 197, 0.2);
            border: 2px solid white;
            /* 숫자 영역을 중앙에 가두기 위한 설정 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 숫자가 그려질 실제 가상의 영역 (중앙 정렬) */
        #path-canvas {
            position: relative;
            width: 300px; /* 숫자가 그려질 영역의 너비 */
            height: 400px;
        }

        .target-btn {
            position: absolute;
            padding: 10px 18px;
            background-color: var(--main-pink);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 141, 161, 0.3);
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .target-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        /* 클릭 흔적 (하트 모양 혹은 원형) */
        .trace {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            pointer-events: none; /* 클릭 방해 금지 */
        }

        #next-link {
            display: none;
            position: absolute;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            background: var(--dark-pink);
            padding: 15px 35px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(255, 141, 161, 0.4);
            z-index: 100;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Touch!</button>
    </div>
    <a href="next_page.html" id="next-link">사랑을 담아 다음으로 💖</a>
</div>

<script>
    // 숫자 '4'의 형태를 만드는 좌표 (중앙 300x400 영역 내의 % 좌표)
    const points = [
        {x: 80, y: 10}, {x: 80, y: 30}, {x: 80, y: 50}, {x: 80, y: 70}, {x: 80, y: 90}, // 세로 기둥
        {x: 10, y: 50}, {x: 30, y: 50}, {x: 50, y: 50}, // 가로 막대
        {x: 60, y: 30}, {x: 40, y: 15}  // 대각선 연결 부위
    ];

    // 배열을 무작위로 섞는 함수 (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            // 모든 클릭 완료
            btn.style.display = 'none';
            nextLink.style.display = 'block';
        }
    }

    btn.addEventListener('click', () => {
        // 현재 위치에 흔적 남기기
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    // 시작 위치 설정
    updateButton();
</script>

</body>
</html>
