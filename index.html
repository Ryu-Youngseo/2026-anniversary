<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sophisticated Radiant 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
            --glow-pink: rgba(255, 141, 161, 0.9);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #game-container {
            position: relative;
            width: 90%; 
            max-width: 1000px;
            height: 750px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            box-shadow: 0 25px 60px rgba(255, 183, 197, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex; justify-content: center; align-items: center;
        }

        /* 슬림한 비율을 위해 캔버스 크기 조정 */
        #path-canvas {
            position: relative;
            width: 500px; 
            height: 600px;
        }

        .target-btn {
            position: absolute;
            padding: 14px 28px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(255, 141, 161, 0.4);
        }

        .trace {
            position: absolute;
            width: 18px; height: 18px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            pointer-events: none;
        }

        /* 은은하게 반짝이는 효과 */
        .glow-effect {
            opacity: 1 !important;
            box-shadow: 0 0 30px 10px var(--glow-pink);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); filter: brightness(1.4); }
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-size: 1.4rem; font-weight: bold;
            background: linear-gradient(135deg, var(--dark-pink), #ff758c);
            padding: 22px 55px; border-radius: 60px;
            box-shadow: 0 15px 40px rgba(255, 141, 161, 0.5);
            z-index: 100; text-align: center;
            animation: popIn 0.8s forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Click! ✨</button>
    </div>
    <a href="https://your-next-page.com" id="next-link">💖 4가 아름답게 빛나요 💖<br>다음으로 이동</a>
</div>

<script>
    // 샤프하고 슬림한 '4' 좌표 (500x600 캔버스 기준 %)
    const points = [
        // 1. 뾰족한 정점 (Top Peak)
        {x: 60, y: 5}, 
        
        // 2. 왼쪽 사선 (정점에서 가로선까지 내려오는 선)
        {x: 45, y: 35}, {x: 30, y: 65}, 
        
        // 3. 가로 막대 (왼쪽에서 기둥 너머까지)
        {x: 45, y: 65}, {x: 75, y: 65}, {x: 90, y: 65},
        
        // 4. 중앙 기둥 (정점 높이 근처에서 바닥까지 관통)
        {x: 75, y: 15}, {x: 75, y: 40}, {x: 75, y: 80}, {x: 75, y: 100}
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            btn.style.display = 'none';
            applyGlowEffect();
            
            setTimeout(() => {
                nextLink.style.display = 'block';
                nextLink.style.top = '50%';
                nextLink.style.left = '50%';
            }, 1000);
        }
    }

    function applyGlowEffect() {
        const traces = document.querySelectorAll('.trace');
        traces.forEach((t, index) => {
            setTimeout(() => {
                t.classList.add('glow-effect');
            }, index * 80);
        });
    }

    btn.addEventListener('click', () => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    updateButton();
</script>

</body>
</html>
