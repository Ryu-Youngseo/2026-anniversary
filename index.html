<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Perfect Shape 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
            --glow-pink: rgba(255, 141, 161, 0.9);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 너무 와이드하지 않게 조정한 메인 박스 */
        #game-container {
            position: relative;
            width: 90%; 
            max-width: 700px; /* 가로폭 제한 */
            height: 800px; /* 세로로 살짝 긴 비율 */
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            box-shadow: 0 25px 60px rgba(255, 183, 197, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex; justify-content: center; align-items: center;
        }

        /* 숫자 '4'가 그려질 영역 (비율 최적화) */
        #path-canvas {
            position: relative;
            width: 450px; 
            height: 600px;
        }

        .target-btn {
            position: absolute;
            padding: 15px 30px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(255, 141, 161, 0.4);
        }

        .trace {
            position: absolute;
            width: 20px; height: 20px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.4;
            pointer-events: none;
        }

        /* 완성 시 반짝이는 효과 */
        .glow-effect {
            opacity: 1 !important;
            box-shadow: 0 0 35px 12px var(--glow-pink);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); filter: brightness(1.5); }
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-size: 1.5rem; font-weight: bold;
            background: linear-gradient(135deg, var(--dark-pink), #ff758c);
            padding: 22px 60px; border-radius: 60px;
            box-shadow: 0 15px 40px rgba(255, 141, 161, 0.5);
            z-index: 100; text-align: center;
            animation: popIn 0.8s forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Touch! ✨</button>
    </div>
    <a href="https://your-next-page.com" id="next-link">💖 4가 완성되었어요 💖<br>클릭해서 이동하기</a>
</div>

<script>
    /* 
       숫자 '4'의 정석 좌표 (450x600 캔버스 기준 %)
       10개의 점으로 구성된 선명한 4 모양
    */
    const points = [
        // 1. 획 (사선): 뾰족한 꼭대기에서 왼쪽 아래로
        {x: 70, y: 5},   // 꼭대기 (기둥과 연결되는 지점 근처)
        {x: 45, y: 35},  // 사선 중간
        {x: 20, y: 65},  // 사선 끝 (가로막대 시작점)

        // 2. 획 (가로): 왼쪽에서 오른쪽으로 길게
        {x: 45, y: 65},  // 가로 중간 1
        {x: 70, y: 65},  // 가로 중간 2 (기둥 교차점)
        {x: 90, y: 65},  // 가로 끝

        // 3. 획 (세로 기둥): 위에서 아래로 관통
        {x: 70, y: 20},  // 기둥 상단
        {x: 70, y: 45},  // 기둥 중간
        {x: 70, y: 80},  // 기둥 하단 1
        {x: 70, y: 95}   // 기둥 최하단
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            btn.style.display = 'none';
            applyGlowEffect();
            
            setTimeout(() => {
                nextLink.style.display = 'block';
                nextLink.style.top = '50%';
                nextLink.style.left = '50%';
            }, 1000);
        }
    }

    function applyGlowEffect() {
        const traces = document.querySelectorAll('.trace');
        traces.forEach((t, index) => {
            setTimeout(() => {
                t.classList.add('glow-effect');
            }, index * 80);
        });
    }

    btn.addEventListener('click', () => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    updateButton();
</script>

</body>
</html>
