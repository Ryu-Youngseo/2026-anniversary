<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Perfect Centered 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--soft-pink) 0%, #ffe4e1 100%);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 85%; max-width: 800px; height: 500px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 183, 197, 0.2);
            border: 2px solid white;
            display: flex; justify-content: center; align-items: center;
        }

        #path-canvas {
            position: relative;
            width: 300px; 
            height: 400px;
        }

        .target-btn {
            position: absolute;
            padding: 10px 20px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.2s ease-out;
            box-shadow: 0 4px 10px rgba(255, 141, 161, 0.3);
        }

        .trace {
            position: absolute;
            width: 15px; height: 15px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.8;
            pointer-events: none;
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-size: 1.2rem; font-weight: bold;
            background: var(--dark-pink);
            padding: 18px 40px; border-radius: 50px;
            box-shadow: 0 8px 25px rgba(255, 141, 161, 0.4);
            z-index: 100; text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Click!</button>
    </div>
    <a href="https://your-next-page.com" id="next-link">완벽한 4 완성! 🌸<br>다음 페이지로</a>
</div>

<script>
    // 숫자 '4'의 정석 좌표 (300x400 캔버스 기준 %)
    const points = [
        // 1. 왼쪽 사선 (Top-Left to Middle-Left)
        {x: 50, y: 10}, {x: 35, y: 35}, {x: 20, y: 60},
        
        // 2. 가로 막대 (Left to Right)
        {x: 35, y: 60}, {x: 65, y: 60}, {x: 85, y: 60},
        
        // 3. 중앙 기둥 (Top to Bottom)
        {x: 65, y: 10}, {x: 65, y: 35}, {x: 65, y: 75}, {x: 65, y: 100}
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            btn.style.display = 'none';
            nextLink.style.display = 'block';
            nextLink.style.top = '50%';
            nextLink.style.left = '50%';
            nextLink.style.transform = 'translate(-50%, -50%)';
        }
    }

    btn.addEventListener('click', () => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    updateButton();
</script>

</body>
</html>
