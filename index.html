<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Wide Glow Path of 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
            --glow-pink: rgba(255, 141, 161, 0.8);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--soft-pink) 0%, #ffe4e1 100%);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 90%; max-width: 900px; height: 500px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 183, 197, 0.2);
            border: 2px solid white;
            display: flex; justify-content: center; align-items: center;
        }

        /* 숫자 영역을 더 와이드하게 조정 (가로 450px) */
        #path-canvas {
            position: relative;
            width: 450px; 
            height: 350px;
        }

        .target-btn {
            position: absolute;
            padding: 12px 24px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(255, 141, 161, 0.3);
        }

        /* 클릭 흔적 디자인 및 애니메이션 */
        .trace {
            position: absolute;
            width: 18px; height: 18px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.8;
            pointer-events: none;
            transition: all 1s ease-in-out;
        }

        /* 10번 클릭 완료 시 적용될 광채 효과 */
        .glow-effect {
            box-shadow: 0 0 20px 5px var(--glow-pink);
            filter: drop-shadow(0 0 10px var(--main-pink));
            opacity: 1 !important;
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-size: 1.3rem; font-weight: bold;
            background: var(--dark-pink);
            padding: 20px 45px; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 141, 161, 0.5);
            z-index: 100; text-align: center;
            animation: popIn 0.6s forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Click! ✨</button>
    </div>
    <a href="https://your-next-page.com" id="next-link">아름다운 4가 완성되었어요!<br>다음으로 이동하기 💖</a>
</div>

<script>
    // 가로로 와이드한 '4'의 정교한 좌표 (450x350 캔버스 기준 %)
    const points = [
        // 1. 왼쪽 사선 (더 완만하고 넓게)
        {x: 60, y: 10}, {x: 35, y: 35}, {x: 10, y: 65},
        
        // 2. 와이드 가로 막대
        {x: 25, y: 65}, {x: 45, y: 65}, {x: 75, y: 65}, {x: 95, y: 65},
        
        // 3. 중앙 기둥 (오른쪽에 위치하여 '4' 모양 완성)
        {x: 75, y: 10}, {x: 75, y: 40}, {x: 75, y: 90}
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            // 완성 시 연출
            btn.style.display = 'none';
            applyGlowEffect();
            
            setTimeout(() => {
                nextLink.style.display = 'block';
                nextLink.style.top = '50%';
                nextLink.style.left = '50%';
            }, 500);
        }
    }

    function applyGlowEffect() {
        const traces = document.querySelectorAll('.trace');
        traces.forEach(t => {
            t.classList.add('glow-effect');
        });
    }

    btn.addEventListener('click', () => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    updateButton();
</script>

</body>
</html>
