<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 4th Anniversary</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ryu-youngseo.github.io/2026-anniversary/main.html">
    <meta property="og:title" content="도영❤️영서 우리의 4주년을 축하해!">
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
            --glow-pink: rgba(255, 141, 161, 0.9);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            touch-action: manipulation; /* 모바일 더블탭 줌 방지 */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* [반응형 박스] */
        #game-container {
            position: relative;
            width: 90%; 
            max-width: 1000px; /* PC 최대폭 */
            height: 600px; 
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 183, 197, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex; justify-content: center; align-items: center;
            transition: all 0.5s ease;
        }

        /* [반응형 숫자 영역] */
        #path-canvas {
            position: relative;
            width: 80%; /* 컨테이너 대비 비율로 변경 */
            max-width: 600px;
            height: 80%;
            max-height: 500px;
        }

        /* 모바일용 미디어 쿼리 (화면 너비 768px 이하) */
        @media screen and (max-width: 768px) {
            #game-container {
                width: 95%; /* 모바일에서 꽉 차게 */
                height: 80vh; /* 세로로 더 길게 */
                border-radius: 30px;
            }
            #path-canvas {
                width: 90%;
                height: 70%;
            }
            .target-btn {
                padding: 12px 24px !important;
                font-size: 1rem !important;
            }
            #next-link {
                width: 80%;
                font-size: 0.9rem;
            }
        }

        .target-btn {
            position: absolute;
            padding: 15px 30px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(255, 141, 161, 0.4);
            white-space: nowrap;
        }

        .trace {
            position: absolute;
            width: 18px; height: 18px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            pointer-events: none;
        }

        @media screen and (max-width: 768px) {
            .trace { width: 14px; height: 14px; }
        }

        .glow-effect {
            opacity: 1 !important;
            box-shadow: 0 0 30px 10px var(--glow-pink);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); filter: brightness(1.4); }
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-weight: bold;
            background: linear-gradient(135deg, var(--dark-pink), #ff758c);
            padding: 15px 25px; border-radius: 60px;
            box-shadow: 0 15px 40px rgba(255, 141, 161, 0.5);
            z-index: 100; text-align: center;
            animation: popIn 0.8s forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Click! ✨</button>
    </div>
    <a href="https://ryu-youngseo.github.io/2026-anniversary/main.html" id="next-link">🌸 4th anniversary 🌸</a>
</div>

<script>
    const points = [
        {x: 50, y: 5}, {x: 50, y: 27.5}, {x: 50, y: 50}, {x: 50, y: 72.5}, {x: 50, y: 95}, 
        {x: 35, y: 27.5}, {x: 20, y: 50}, 
        {x: 35, y: 50}, {x: 60, y: 50}, {x: 75, y: 50}
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            btn.style.display = 'none';
            applyGlowEffect();
            setTimeout(() => {
                nextLink.style.display = 'block';
                nextLink.style.top = '50%';
                nextLink.style.left = '50%';
            }, 1000);
        }
    }

    function applyGlowEffect() {
        const traces = document.querySelectorAll('.trace');
        traces.forEach((t, index) => {
            setTimeout(() => {
                t.classList.add('glow-effect');
            }, index * 80);
        });
    }

    btn.addEventListener('click', (e) => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    updateButton();
</script>

</body>
</html>
