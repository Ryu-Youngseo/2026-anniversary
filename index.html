<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Centered Path of 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--soft-pink) 0%, #ffe4e1 100%);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 85%; max-width: 900px; height: 550px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 183, 197, 0.2);
            border: 2px solid white;
            display: flex; justify-content: center; align-items: center;
        }

        #path-canvas {
            position: relative;
            width: 350px; /* 숫자 영역 너비 */
            height: 450px; /* 숫자 영역 높이 */
        }

        .target-btn {
            position: absolute;
            padding: 12px 22px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(255, 141, 161, 0.3);
        }

        .trace {
            position: absolute;
            width: 14px; height: 14px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.7;
            pointer-events: none;
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-size: 1.2rem; font-weight: bold;
            background: var(--dark-pink);
            padding: 18px 40px; border-radius: 50px;
            box-shadow: 0 8px 25px rgba(255, 141, 161, 0.4);
            z-index: 100; animation: pop 0.5s ease-out;
            text-align: center;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Click Me!</button>
    </div>
    <a href="https://your-next-page.com" id="next-link">숫자 4 완성!<br>다음으로 이동하기 🌸</a>
</div>

<script>
    // 숫자 '4'의 기둥을 중앙(x: 50)으로 배치한 10개의 좌표
    const points = [
        // 1. 중앙 세로 기둥 (Main Pillar) - x축 50% 고정
        {x: 50, y: 10}, {x: 50, y: 32}, {x: 50, y: 55}, {x: 50, y: 77}, {x: 50, y: 100},
        
        // 2. 왼쪽 사선 (Slanted Line)
        {x: 10, y: 60}, {x: 30, y: 35}, 
        
        // 3. 가로 막대 (Cross Bar) - 기둥을 가로지름
        {x: 10, y: 60}, {x: 30, y: 60}, {x: 70, y: 60}
    ];

    // 무작위 섞기 (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            btn.style.display = 'none';
            nextLink.style.display = 'block';
        }
    }

    btn.addEventListener('click', () => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    // 첫 위치 초기화
    updateButton();
</script>

</body>
</html>
