<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Grand Radiant Path of 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
            --glow-pink: rgba(255, 141, 161, 0.8);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            /* 배경에 은은한 별빛 효과 애니메이션 */
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #game-container {
            position: relative;
            width: 90%; 
            max-width: 1000px; /* 가로 크기 확장 */
            height: 700px; /* 세로 크기 확장 */
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(255, 183, 197, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: flex; justify-content: center; align-items: center;
        }

        /* 숫자 영역을 더 크고 와이드하게 (600x500) */
        #path-canvas {
            position: relative;
            width: 600px; 
            height: 500px;
        }

        .target-btn {
            position: absolute;
            padding: 15px 30px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(255, 141, 161, 0.4);
        }

        .trace {
            position: absolute;
            width: 22px; height: 22px; /* 흔적 크기 키움 */
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.6;
            pointer-events: none;
            transition: all 0.8s ease-in-out;
        }

        /* 완성 시 숨쉬듯 반짝이는 효과 */
        .glow-effect {
            opacity: 1 !important;
            box-shadow: 0 0 25px 8px var(--glow-pink);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); filter: brightness(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-size: 1.5rem; font-weight: bold;
            background: linear-gradient(to right, var(--dark-pink), #ff6b81);
            padding: 25px 60px; border-radius: 60px;
            box-shadow: 0 15px 40px rgba(255, 141, 161, 0.6);
            z-index: 100; text-align: center;
            animation: popIn 0.8s forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">찾아봐요! ✨</button>
    </div>
    <a href="https://your-next-page.com" id="next-link">💖 아름다운 4가 빛나요 💖<br>다음으로 이동</a>
</div>

<script>
    // 더 와이드하고 큼직한 '4'의 정밀 좌표 (600x500 캔버스 기준 %)
    const points = [
        // 1. 왼쪽 사선 (더 길고 완만하게)
        {x: 55, y: 10}, {x: 30, y: 40}, {x: 5, y: 70},
        
        // 2. 가로 막대 (좌측 끝에서 우측까지 시원하게)
        {x: 25, y: 70}, {x: 50, y: 70}, {x: 75, y: 70}, {x: 95, y: 70},
        
        // 3. 중앙 기둥 (우측 75% 지점에 수직으로 배치)
        {x: 75, y: 10}, {x: 75, y: 40}, {x: 75, y: 95}
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            btn.style.display = 'none';
            applyGlowEffect();
            
            setTimeout(() => {
                nextLink.style.display = 'block';
                nextLink.style.top = '50%';
                nextLink.style.left = '50%';
            }, 800);
        }
    }

    function applyGlowEffect() {
        const traces = document.querySelectorAll('.trace');
        traces.forEach((t, index) => {
            // 순차적으로 불이 들어오는 듯한 느낌
            setTimeout(() => {
                t.classList.add('glow-effect');
            }, index * 100);
        });
    }

    btn.addEventListener('click', () => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    updateButton();
</script>

</body>
</html>
