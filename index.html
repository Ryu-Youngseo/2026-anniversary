<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Perfect Centered Wide 4</title>
    <style>
        :root {
            --main-pink: #ffb7c5;
            --soft-pink: #fff0f5;
            --dark-pink: #ff8da1;
            --glow-pink: rgba(255, 141, 161, 0.9);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 내부 박스 : 가로 와이드 설정 */
        #game-container {
            position: relative;
            width: 90%; 
            max-width: 1000px; /* 가로로 넓게 */
            height: 600px; 
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(255, 183, 197, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex; justify-content: center; align-items: center;
        }

        /* 숫자 영역 : 박스 전체를 채우되 기둥은 중앙 정렬 */
        #path-canvas {
            position: relative;
            width: 600px; /* 숫자 가로폭 (와이드 박스보다는 작게) */
            height: 500px; /* 박스 세로를 거의 채우도록 설정 */
        }

        .target-btn {
            position: absolute;
            padding: 15px 30px;
            background-color: var(--main-pink);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(255, 141, 161, 0.4);
        }

        .trace {
            position: absolute;
            width: 22px; height: 22px;
            background-color: var(--dark-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            pointer-events: none;
        }

        /* 은은하게 반짝이는 효과 */
        .glow-effect {
            opacity: 1 !important;
            box-shadow: 0 0 35px 12px var(--glow-pink);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); filter: brightness(1.4); }
        }

        #next-link {
            display: none; position: absolute;
            text-decoration: none; color: white;
            font-size: 1.5rem; font-weight: bold;
            background: linear-gradient(135deg, var(--dark-pink), #ff758c);
            padding: 22px 60px; border-radius: 60px;
            box-shadow: 0 15px 40px rgba(255, 141, 161, 0.5);
            z-index: 100; text-align: center;
            animation: popIn 0.8s forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="path-canvas">
        <button id="main-button" class="target-btn">Click! ✨</button>
    </div>
    <a href="https://your-next-page.com" id="next-link">🌸 4th anniversary 🌸</a>
</div>

<script>
    /* 
       숫자 '4'의 좌표 설계:
       기둥(세로선)을 중앙(x: 50)으로 고정하여 정렬.
    */
   const points = [
        // 1. 세로 기둥 (Main Pillar) : x: 50% 고정, y축 22.5%씩 균등 간격
        {x: 50, y: 5},   // 꼭대기
        {x: 50, y: 27.5}, 
        {x: 50, y: 50},  // 가로선과의 교차점
        {x: 50, y: 72.5}, 
        {x: 50, y: 95},  // 바닥
    
        // 2. 왼쪽 사선 (Slanted Line) : (50,5)에서 (20,50)까지 일정한 기울기
        // x축 15씩, y축 22.5씩 변화
        {x: 35, y: 27.5}, 
        {x: 20, y: 50}, 
    
        // 3. 가로 막대 (Horizontal Line) : y: 50% 고정, x축 15~20씩 균등 간격
        // 사선 끝점(20,50)부터 기둥 오른쪽(70,50)까지
        {x: 35, y: 50},  // 사선과 기둥 사이 중간점
        {x: 60, y: 50},  // 기둥 오른쪽 첫 번째 점 (기둥 50에서 10만큼 이동)
        {x: 75, y: 50}   // 가로 막대 끝점 (이전 점과 15차이)
    ];
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const randomizedPath = shuffle([...points]);
    let clickCount = 0;

    const btn = document.getElementById('main-button');
    const canvas = document.getElementById('path-canvas');
    const nextLink = document.getElementById('next-link');

    function updateButton() {
        if (clickCount < randomizedPath.length) {
            const pos = randomizedPath[clickCount];
            btn.style.left = pos.x + "%";
            btn.style.top = pos.y + "%";
        } else {
            btn.style.display = 'none';
            applyGlowEffect();
            
            setTimeout(() => {
                nextLink.style.display = 'block';
                nextLink.style.top = '50%';
                nextLink.style.left = '50%';
            }, 1000);
        }
    }

    function applyGlowEffect() {
        const traces = document.querySelectorAll('.trace');
        traces.forEach((t, index) => {
            setTimeout(() => {
                t.classList.add('glow-effect');
            }, index * 80);
        });
    }

    btn.addEventListener('click', () => {
        const trace = document.createElement('div');
        trace.className = 'trace';
        trace.style.left = btn.style.left;
        trace.style.top = btn.style.top;
        canvas.appendChild(trace);

        clickCount++;
        updateButton();
    });

    updateButton();
</script>

</body>
</html>
