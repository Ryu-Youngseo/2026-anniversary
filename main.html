<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Happy 4th Anniversary</title>
    <style>
        :root {
            --bg-pink: #fff0f5;
            --anniversary-gold: #ffd700;
            --heart-red: #ff4d6d;
            --soft-white: rgba(255, 255, 255, 0.8);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(180deg, var(--bg-pink) 0%, #ffdee9 100%);
            font-family: 'Pretendard', sans-serif;
            color: #4a4a4a;
        }

        /* 화려한 타이틀 */
        .title {
            margin-top: 50px;
            font-size: 2.5rem;
            color: var(--heart-red);
            text-shadow: 2px 2px 10px rgba(255, 77, 109, 0.3);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 달력 스타일 */
        .calendar-container {
            margin-top: 30px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border: 3px solid var(--anniversary-gold);
            width: 350px;
        }

        .calendar-header {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }

        .day-label { font-weight: bold; color: #999; font-size: 0.8rem; }

        .day { padding: 10px 0; border-radius: 10px; font-weight: 500; position: relative; }

        /* 5월 13일 강조 효과 */
        .anniversary-day {
            background-color: var(--heart-red);
            color: white !important;
            font-weight: bold;
            border-radius: 50%;
            box-shadow: 0 0 20px var(--heart-red);
            z-index: 1;
        }

        .anniversary-day::after {
            content: "4th 🎉";
            position: absolute;
            top: -25px; left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--heart-red);
            white-space: nowrap;
            animation: twinkle 1s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.5; transform: translateX(-50%) scale(0.9); }
            to { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }

        /* 하트 사진 프레임 영역 */
        .heart-gallery {
            margin-top: 60px;
            display: flex;
            gap: 30px;
            padding-bottom: 50px;
        }

        .heart-frame {
            position: relative;
            width: 150px;
            height: 150px;
            background-color: white;
            border: 4px solid var(--heart-red);
            /* 하트 모양 만들기 */
            clip-path: path('M75 145c-30-20-75-55-75-100 0-25 20-45 45-45 15 0 25 10 30 15 5-5 15-15 30-15 25 0 45 20 45 45 0 45-45 80-75 100z');
            transition: transform 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .heart-frame:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .heart-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .heart-frame::before {
            content: "Photo";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--heart-red);
            font-size: 0.8rem;
            font-weight: bold;
            z-index: -1;
        }
    </style>
</head>
<body>

    <h1 class="title">Together Forever ✨</h1>

    <div class="calendar-container">
        <div class="calendar-header">2026. 05</div>
        <div class="calendar-grid">
            <div class="day-label">S</div><div class="day-label">M</div><div class="day-label">T</div><div class="day-label">W</div><div class="day-label">T</div><div class="day-label">F</div><div class="day-label">S</div>
            
            <!-- 2026년 5월 달력 (1일은 금요일 시작) -->
            <div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div>
            <div class="day">1</div><div class="day">2</div>
            <div class="day">3</div><div class="day">4</div><div class="day">5</div><div class="day">6</div><div class="day">7</div><div class="day">8</div><div class="day">9</div>
            <div class="day">10</div><div class="day">11</div><div class="day">12</div>
            <!-- 13일 주인공 -->
            <div class="day anniversary-day">13</div>
            <div class="day">14</div><div class="day">15</div><div class="day">16</div>
            <div class="day">17</div><div class="day">18</div><div class="day">19</div><div class="day">20</div><div class="day">21</div><div class="day">22</div><div class="day">23</div>
            <div class="day">24</div><div class="day">25</div><div class="day">26</div><div class="day">27</div><div class="day">28</div><div class="day">29</div><div class="day">30</div>
            <div class="day">31</div>
        </div>
    </div>

    <div class="heart-gallery">
        <!-- img 태그의 src 부분에 원하는 jpg 파일 경로를 넣으세요! -->
        <div class="heart-frame">
            <img src="photo1.jpg" alt="우리 사진 1">
        </div>
        <div class="heart-frame">
            <img src="photo2.jpg" alt="우리 사진 2">
        </div>
        <div class="heart-frame">
            <img src="photo3.jpg" alt="우리 사진 3">
        </div>
    </div>

</body>
</html>
